<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trash Bin | EuFile Workspace</title>
    <link href="../styles.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        #sidebar { transition: transform 0.3s ease-in-out; }
        @media (max-width: 1024px) {
            #sidebar { transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
        }

        #bulkActionsBar { transition: all 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28); backdrop-filter: blur(16px); }
        #bulkActionsBar.active { transform: translate(-50%, 0); opacity: 1; display: flex; }

        .item-card { position: relative; transition: all 0.3s ease; }
        .item-card.selected { border-color: #03acfa !important; background-color: rgba(3, 172, 250, 0.05) !important; }

        /* Custom Checkbox Style for Grid */
        .selection-dot { 
            position: absolute; top: 18px; left: 18px; width: 20px; height: 20px; 
            border-radius: 6px; border: 2px solid #e2e8f0; display: flex; 
            align-items: center; justify-content: center; transition: 0.2s; 
            background: white; z-index: 50; cursor: pointer;
        }
        .selected .selection-dot { background: #03acfa; border-color: #03acfa; }
        .selection-dot svg { display: none; }
        .selected .selection-dot svg { display: block; }

        .ellipsis-btn { position: absolute; top: 15px; right: 15px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: #94a3b8; border-radius: 50%; transition: 0.2s; z-index: 10; border: none; background: transparent; cursor: pointer; font-size: 1.2rem; }
        .ellipsis-btn:hover { background: #f1f5f9; color: #1e293b; }

        /* Custom Modal Styling */
        #sysModalOverlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 50000; align-items: center; justify-content: center; }
        .sys-modal { background: white; width: 100%; max-width: 400px; border-radius: 32px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }

        #screenContextMenu { display: none; position: fixed; background: white; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 10000; min-width: 200px; padding: 8px; }
        .menu-item { padding: 10px 12px; font-size: 13px; font-weight: 600; color: #475569; cursor: pointer; border-radius: 8px; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .menu-item:hover { background: #f1f5f9; color: #03acfa; }
        .menu-item.delete { color: #ef4444; }
        .menu-item.restore { color: #10b981; }

        @keyframes toast-in { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .animate-toast { animation: toast-in 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards; }
        
        .page-btn { padding: 8px 16px; border-radius: 10px; border: 1px solid #e2e8f0; background: white; font-weight: 700; font-size: 12px; transition: 0.2s; cursor: pointer; }
        .page-btn:hover:not(:disabled) { background: #f8fafc; border-color: #03acfa; color: #03acfa; }
        .page-btn.active { background: #03acfa; border-color: #03acfa; color: white; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 flex h-screen overflow-hidden">

    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden"></div>

    <aside id="sidebar" class="fixed lg:static w-72 bg-slate-900 flex flex-col h-full z-50 shrink-0 overflow-y-auto">
        <div class="p-8 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#03acfa] rounded-xl flex items-center justify-center shadow-lg shadow-[#03acfa]/20">
                    <i data-lucide="cloud" class="text-white w-6 h-6"></i>
                </div>
                <span class="font-black text-xl tracking-tight text-white uppercase">EuFile</span>
            </div>
            <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 p-1 hover:text-white transition-colors">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <nav class="flex-1 px-4 space-y-8 pt-4 font-sans">
            <div>
                <p class="px-4 text-[11px] font-bold text-slate-500 uppercase tracking-[2px] mb-4">Main Menu</p>
                <a href="User_Dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition-all">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span class="font-semibold text-sm">Dashboard</span>
                </a>
            </div>

            <div>
                <p class="px-4 text-[11px] font-bold text-slate-500 uppercase tracking-[2px] mb-4">Workspace</p>
                <div class="space-y-1">
                    <a href="User_PrivateVault.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition-all group">
                        <i data-lucide="lock" class="w-5 h-5 group-hover:text-[#03acfa]"></i>
                        <span class="font-semibold text-sm">Private Storage</span>
                    </a>
                    <a href="User_DeptVault.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition-all group">
                        <i data-lucide="users" class="w-5 h-5 group-hover:text-[#03acfa]"></i>
                        <span class="font-semibold text-sm">Department Files</span>
                    </a>
                    <a href="User_Requests.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition-all group">
                        <i data-lucide="file-text" class="w-5 h-5 group-hover:text-[#03acfa]"></i>
                        <span class="font-semibold text-sm">Requests</span>
                    </a>
                </div>
            </div>

            <div>
                <p class="px-4 text-[11px] font-bold text-slate-500 uppercase tracking-[2px] mb-4">Records</p>
                <div class="space-y-1">
                    <a href="User_Archive.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition-all group">
                        <i data-lucide="archive" class="w-5 h-5 group-hover:text-[#03acfa]"></i>
                        <span class="font-semibold text-sm">Archives</span>
                    </a>
                    <a href="User_Trash.html" class="flex items-center gap-3 px-4 py-3 bg-[#03acfa] text-white rounded-xl shadow-md shadow-[#03acfa]/20 transition-all group">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                        <span class="font-semibold text-sm">Trash</span>
                    </a>
                </div>
            </div>

            <div>
                <p class="px-4 text-[11px] font-bold text-slate-500 uppercase tracking-[2px] mb-4">Account</p>
                <div class="space-y-1">
                    <a href="User_Profile.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition-all group">
                        <i data-lucide="user" class="w-5 h-5 group-hover:text-[#03acfa]"></i>
                        <span class="font-semibold text-sm">My Profile</span>
                    </a>
                </div>
            </div>
        </nav>

        <div class="p-6 border-t border-slate-800">
            <button onclick="handleLogout()" class="w-full flex items-center justify-center gap-2 px-4 py-3 text-rose-400 border border-rose-400/20 hover:bg-rose-500 hover:text-white rounded-xl font-bold transition-all text-sm uppercase tracking-widest active:scale-95">
                <i data-lucide="log-out" class="w-4 h-4"></i> Sign Out
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto scroll-smooth w-full relative">
        <div class="lg:hidden bg-white border-b border-slate-200 p-4 flex items-center justify-between sticky top-0 z-30">
            <span class="font-black text-slate-900 uppercase">EuFile</span>
            <button onclick="toggleSidebar()" class="p-2 bg-slate-100 rounded-lg"><i data-lucide="menu"></i></button>
        </div>

        <div class="p-6 lg:p-12 max-w-[1600px] mx-auto w-full">
            
            <div class="bg-white p-8 rounded-[40px] border border-slate-200 shadow-sm mb-6">
                <div id="breadcrumb" class="flex flex-wrap items-center gap-2 text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4"><span>Records</span> <span class="mx-2 opacity-30">/</span> <span class="text-[#03acfa]">Trash</span></div>
                
                <h1 class="text-3xl font-black tracking-tight text-slate-900 mb-8 uppercase leading-none">Deleted Files</h1>
                
                <div class="flex flex-col xl:flex-row xl:items-center justify-between gap-6">
                    <div class="flex flex-wrap items-center gap-3">
                        <button onclick="fetchTrash()" class="px-6 py-3 bg-white border-2 border-slate-100 text-slate-600 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-slate-50 transition-all flex items-center gap-2 shadow-sm">
                            <i id="refreshIcon" data-lucide="refresh-cw" class="w-4 h-4"></i> Refresh List
                        </button>
                    </div>

                    <div class="flex flex-wrap items-center gap-4 w-full xl:w-auto">
                        <div class="relative w-full sm:w-64 group">
                            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 group-focus-within:text-[#03acfa] transition-colors"></i>
                            <input type="text" id="trashSearch" onkeyup="applyFilters()" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:ring-4 focus:ring-[#03acfa]/10 transition-all shadow-sm" placeholder="Search deleted files...">
                        </div>
                        <div class="flex gap-2 bg-white p-1.5 rounded-2xl border border-slate-200 shadow-sm">
                            <button id="gridToggle" onclick="toggleViewMode('grid')" class="p-3 rounded-xl transition-all bg-[#03acfa] text-white shadow-md"><i data-lucide="layout-grid" class="w-4 h-4"></i></button>
                            <button id="listToggle" onclick="toggleViewMode('list')" class="p-3 rounded-xl text-slate-400 hover:bg-slate-50"><i data-lucide="list" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="trashGrid" class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-6 mb-12"></div>
            
            <div id="trashList" class="hidden bg-white rounded-[40px] border border-slate-200 shadow-sm overflow-hidden mb-12">
                <div class="overflow-x-auto no-scrollbar">
                    <table class="w-full text-left min-w-[900px]">
                        <thead>
                            <tr class="bg-slate-50/50">
                                <th class="px-8 py-6 text-[10px] font-black text-slate-400 uppercase tracking-widest w-20 text-center border-b border-slate-100">
                                    <input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll(event)" class="w-5 h-5 rounded-lg border-slate-300 text-[#03acfa] cursor-pointer">
                                </th>
                                <th class="px-8 py-6 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">File Name</th>
                                <th class="px-8 py-6 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">Format</th>
                                <th class="px-8 py-6 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">Date Deleted</th>
                                <th class="px-8 py-6 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100 text-right">Options</th>
                            </tr>
                        </thead>
                        <tbody id="trashTableBody" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>

            <div id="paginationContainer" class="py-8 border-t border-slate-100 flex items-center justify-between"></div>
        </div>

        <div id="bulkActionsBar" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-10 py-5 rounded-[32px] shadow-2xl z-[100] hidden items-center gap-10 translate-y-[200%] opacity-0 border border-white/20">
            <div class="flex items-center gap-4 pr-10 border-r border-white/10">
                <div class="w-10 h-10 bg-[#03acfa] text-white rounded-full flex items-center justify-center font-black text-sm" id="selectedCount">0</div>
                <div class="text-left font-sans">
                    <p class="text-[10px] font-black uppercase tracking-widest text-[#03acfa]">Bulk Actions</p>
                    <p class="text-xs font-bold text-slate-300 italic">Files Selected</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="requestExecuteAction('restore')" class="px-6 py-2.5 bg-emerald-500 text-white rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-emerald-600 transition-all shadow-lg flex items-center gap-2"><i data-lucide="refresh-ccw" class="w-4 h-4"></i> Restore Files</button>
                <div class="w-px h-6 bg-white/20 mx-2"></div>
                <button onclick="requestExecuteAction('delete')" class="px-6 py-2.5 bg-rose-500 text-white rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-rose-600 transition-all shadow-lg flex items-center gap-2"><i data-lucide="trash-2" class="w-4 h-4"></i> Delete Forever</button>
                <button onclick="clearSelection()" class="px-4 py-2 text-slate-400 hover:text-white text-[10px] font-black uppercase tracking-widest transition-colors font-sans ml-2">Cancel</button>
            </div>
        </div>
    </main>

    <div id="sysModalOverlay" class="flex">
        <div class="sys-modal animate-toast">
            <div id="modalIcon" class="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center mx-auto mb-6"></div>
            <h3 id="sysModalTitle" class="text-xl font-black text-slate-900 text-center uppercase mb-4">Notice</h3>
            <p id="sysModalMsg" class="text-sm font-bold text-slate-500 text-center mb-10"></p>
            <div id="modalButtons" class="flex gap-4"></div>
        </div>
    </div>

    <div id="screenContextMenu"></div>
    <div id="toastContainer" class="fixed top-8 right-8 z-[30000] flex flex-col gap-4 w-80 font-sans"></div>

    <script>
        // =============================================
        // SYSTEM MODAL SYSTEM (Replaces alert, confirm)
        // =============================================
        const sysModal = {
            overlay: document.getElementById('sysModalOverlay'),
            title: document.getElementById('sysModalTitle'),
            msg: document.getElementById('sysModalMsg'),
            icon: document.getElementById('modalIcon'),
            btnContainer: document.getElementById('modalButtons'),

            show(config) {
                this.title.innerText = config.title || 'Notice';
                this.msg.innerText = config.message || '';
                this.icon.innerHTML = `<i data-lucide="${config.icon || 'info'}" class="w-8 h-8 ${config.iconColor || 'text-[#03acfa]'}"></i>`;
                this.btnContainer.innerHTML = '';

                if(config.type === 'confirm') {
                    const cancelBtn = document.createElement('button');
                    cancelBtn.className = 'flex-1 py-4 bg-white border border-slate-200 text-slate-500 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-slate-50 transition-all';
                    cancelBtn.innerText = 'Cancel';
                    cancelBtn.onclick = () => { this.close(); if(config.onCancel) config.onCancel(); };
                    this.btnContainer.appendChild(cancelBtn);
                }

                const confirmBtn = document.createElement('button');
                confirmBtn.className = `flex-1 py-4 ${config.danger ? 'bg-rose-500' : 'bg-[#03acfa]'} text-white rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl hover:opacity-90 active:scale-95 transition-all`;
                confirmBtn.innerText = config.confirmText || 'Confirm';
                confirmBtn.onclick = () => { 
                    this.close(); 
                    if(config.onConfirm) config.onConfirm(); 
                };
                this.btnContainer.appendChild(confirmBtn);

                this.overlay.style.display = 'flex';
                lucide.createIcons();
            },
            close() { this.overlay.style.display = 'none'; }
        };

        // ======================================
        // TRASH JS (LOGIC PRESERVED)
        // ======================================

        let trashState = { items: [], filtered: [], currentPage: 1, limit: 12 };
        let selectedItems = new Set();
        let viewMode = 'grid';

        document.addEventListener("DOMContentLoaded", () => { 
            sysModal.close();
            lucide.createIcons();
            fetchTrash(); 
            
            document.querySelector("main").addEventListener("contextmenu", (e) => {
                if (e.target.closest(".item-card") || e.target.closest("tr")) return;
                e.preventDefault(); closeContextMenu();
            });
            document.addEventListener("click", () => { closeContextMenu(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { clearSelection(); closeContextMenu(); } });
        });

        // Helpers
        function getProfessionalIcon(type, ext) {
            if (type === "folder") return `<svg width=\"54\" height=\"54\" viewBox=\"0 0 24 24\" fill=\"rgba(3,172,250,0.15)\" stroke=\"#03acfa\" stroke-width=\"1.5\"><path d=\"M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z\"></path></svg>`;
            if (ext === "pdf") return `<svg width=\"46\" height=\"46\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#ef4444\" stroke-width=\"1.5\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"></path><polyline points=\"14 2 14 8 20 8\"></polyline></svg>`;
            if (["jpg", "jpeg", "png", "webp", "gif"].includes(ext)) return `<svg width=\"46\" height=\"46\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#a855f7\" stroke-width=\"1.5\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\" ry=\"2\"></rect><circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"></circle><polyline points=\"21 15 16 10 5 21\"></polyline></svg>`;
            if (["xlsx", "xls", "csv"].includes(ext)) return `<svg width=\"46\" height=\"46\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#10b981\" stroke-width=\"1.5\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"></path><polyline points=\"14 2 14 8 20 8\"></polyline></svg>`;
            return `<svg width=\"46\" height=\"46\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#64748b\" stroke-width=\"1.5\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"></path><polyline points=\"14 2 14 8 20 8\"></polyline></svg>`;
        }
        function formatSize(b) { if (!b) return "0 KB"; const kb = b / 1024; return kb >= 1024 ? (kb / 1024).toFixed(1) + " MB" : kb.toFixed(0) + " KB"; }

        // Fetch Logic Preserved
        async function fetchTrash() {
            const icon = document.getElementById('refreshIcon');
            if(icon) icon.classList.add('animate-spin');
            try {
                const res = await fetch('../User_Backend/get_user_trash.php');
                const data = await res.json();
                trashState.items = data.data || [];
                applyFilters();
            } catch (err) { 
                showToast("Connection failure.", "error"); 
            } finally {
                if(icon) setTimeout(() => icon.classList.remove('animate-spin'), 500);
            }
        }

        function applyFilters() {
            const query = document.getElementById('trashSearch')?.value.toLowerCase() || "";
            trashState.filtered = trashState.items.filter(i => (i.name || i.file_name).toLowerCase().includes(query));
            trashState.currentPage = 1;
            displayResults();
        }

        function displayResults() {
            const grid = document.getElementById('trashGrid');
            const list = document.getElementById('trashTableBody');
            grid.innerHTML = ""; list.innerHTML = "";

            const total = trashState.filtered.length;
            const start = (trashState.currentPage - 1) * trashState.limit;
            const paginated = trashState.filtered.slice(start, start + trashState.limit);

            if (total === 0) {
                grid.innerHTML = '<div class="col-span-full py-20 text-center font-black text-slate-200 uppercase tracking-widest">Trash is empty</div>';
                list.innerHTML = '<tr><td colspan="5" class="py-20 text-center font-black text-slate-300 uppercase text-xs tracking-widest">No Content Found</td></tr>';
            } else {
                paginated.forEach(item => {
                    const id = item.id;
                    const type = item.type;
                    const name = item.name || item.file_name;
                    const key = `${type}-${id}`;
                    const isSelected = selectedItems.has(key);
                    const ext = type === "file" ? name.split(".").pop().toLowerCase() : "";
                    const iconSVG = getProfessionalIcon(type, ext);
                    const sizeTxt = type === 'folder' ? '-' : formatSize(item.file_size);
                    const dateTxt = formatDate(item.deleted_at);

                    // Grid Card Injection
                    const card = document.createElement("div");
                    card.className = `item-card bg-white p-8 rounded-[40px] border border-slate-200 shadow-sm relative group hover:shadow-xl transition-all cursor-pointer font-sans ${isSelected ? 'selected' : 'hover:border-[#03acfa]/20'}`;
                    card.innerHTML = `
                        <div class="selection-dot" onclick="event.stopPropagation(); toggleSelect('${id}', '${type}', event)">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </div>
                        <button class="ellipsis-btn" onclick="event.stopPropagation(); showContextMenu(event, '${id}', '${type}', '${name.replace(/'/g, "\\'")}')">
                            <i data-lucide="more-vertical" class="w-5 h-5"></i>
                        </button>
                        <div class="mb-6 flex justify-center opacity-80 group-hover:scale-110 transition-all">${iconSVG}</div>
                        <h4 class="text-sm font-black text-slate-900 text-center uppercase tracking-tight truncate px-2 mb-2 leading-none" title="${name}">${name}</h4>
                        <p class="text-[9px] font-bold text-slate-400 text-center uppercase tracking-widest">${type === 'folder' ? 'DIRECTORY' : sizeTxt}</p>
                    `;
                    card.onclick = (e) => { toggleSelect(id, type, e); };
                    grid.appendChild(card);

                    // List Row Injection
                    const tr = document.createElement("tr");
                    tr.className = `hover:bg-slate-50 transition-all group cursor-pointer ${isSelected ? 'bg-indigo-50/30' : ''}`;
                    tr.onclick = (e) => { toggleSelect(id, type, e); };
                    tr.innerHTML = `
                        <td class="px-8 py-6 text-center">
                            <input type="checkbox" class="w-5 h-5 rounded-lg border-slate-300 text-[#03acfa] cursor-pointer" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); toggleSelect('${id}', '${type}', event)">
                        </td>
                        <td class="px-8 py-6 flex items-center gap-4">
                            <div class="w-8 h-8 flex items-center justify-center">${iconSVG.replace(/54|46/g, '20')}</div> 
                            <span class="text-sm font-black text-slate-900 uppercase tracking-tight">${name}</span>
                        </td>
                        <td class="px-8 py-6 text-[10px] font-black text-slate-400 uppercase tracking-widest">${type === 'folder' ? 'DIR' : ext.toUpperCase() || 'FILE'}</td>
                        <td class="px-8 py-6 text-[10px] font-black text-slate-400 uppercase tracking-widest">${dateTxt}</td>
                        <td class="px-8 py-6 text-right">
                            <button class="text-slate-300 hover:text-[#03acfa] transition-colors" onclick="event.stopPropagation(); showContextMenu(event, '${id}', '${type}', '${name.replace(/'/g, "\\'")}')">
                                <i data-lucide="more-vertical" class="w-5 h-5 ml-auto"></i>
                            </button>
                        </td>
                    `;
                    list.appendChild(tr);
                });
            }

            toggleViewMode(viewMode);
            renderPaginationUI();
            lucide.createIcons();
        }

        function toggleViewMode(mode) {
            viewMode = mode;
            document.getElementById("trashGrid").style.display = (mode === "grid") ? "grid" : "none";
            document.getElementById("trashList").style.display = (mode === "list") ? "block" : "none";
            document.getElementById("gridToggle").className = mode === "grid" ? "p-3 rounded-xl transition-all bg-[#03acfa] text-white shadow-md" : "p-3 rounded-xl text-slate-400 hover:bg-slate-50";
            document.getElementById("listToggle").className = mode === "list" ? "p-3 rounded-xl transition-all bg-[#03acfa] text-white shadow-md" : "p-3 rounded-xl text-slate-400 hover:bg-slate-50";
        }

        function renderPaginationUI() {
            const container = document.getElementById("paginationContainer");
            if(!container) return;
            const total = trashState.filtered.length;
            if (total === 0) { container.innerHTML = ""; return; }

            const totalPages = Math.ceil(total / trashState.limit);
            const start = ((trashState.currentPage - 1) * trashState.limit) + 1;
            const end = Math.min(trashState.currentPage * trashState.limit, total);

            let buttons = '';
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= trashState.currentPage - 1 && i <= trashState.currentPage + 1)) {
                    buttons += `<button class="page-btn ${i === trashState.currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                } else if (i === trashState.currentPage - 2 || i === trashState.currentPage + 2) {
                    buttons += `<span style="padding:0 8px; opacity:0.3;">...</span>`;
                }
            }

            container.className = "py-8 border-t border-slate-100 flex items-center justify-between";
            container.innerHTML = `
                <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Entry ${start} - ${end} of ${total}</div>
                <div class="flex items-center gap-2">
                    <button class="page-btn" onclick="goToPage(${trashState.currentPage - 1})" ${trashState.currentPage === 1 ? 'disabled' : ''}><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                    ${buttons}
                    <button class="page-btn" onclick="goToPage(${trashState.currentPage + 1})" ${trashState.currentPage === totalPages ? 'disabled' : ''}><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                </div>
            `;
            lucide.createIcons();
        }

        function goToPage(p) {
            const totalPages = Math.ceil(trashState.filtered.length / trashState.limit);
            if (p < 1 || p > totalPages) return;
            trashState.currentPage = p; displayResults(); window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleSelect(id, type, e) {
            if(e) e.stopPropagation();
            const key = `${type}-${id}`;
            selectedItems.has(key) ? selectedItems.delete(key) : selectedItems.add(key);
            updateSelectionUI();
        }

        function toggleSelectAll(e) {
            const all = e.target.checked;
            trashState.filtered.forEach(i => {
                const key = `${i.type}-${i.id}`;
                all ? selectedItems.add(key) : selectedItems.delete(key);
            });
            updateSelectionUI();
        }

        function updateSelectionUI() {
            const bar = document.getElementById("bulkActionsBar");
            document.getElementById("selectedCount").innerText = selectedItems.size;
            
            document.querySelectorAll('.item-card').forEach(card => {
                card.classList.toggle('selected', false); 
            });
            document.getElementById('selectAllCheckbox').checked = (selectedItems.size === trashState.filtered.length && trashState.filtered.length > 0);
            
            displayResults(); 
            
            if (selectedItems.size > 0) { bar.classList.remove("hidden"); bar.classList.add("active"); } 
            else { bar.classList.remove("active"); bar.classList.add("hidden"); }
        }

        function clearSelection() { selectedItems.clear(); updateSelectionUI(); }

        function showContextMenu(e, id, type, name) {
            e.preventDefault(); e.stopPropagation();
            const menu = document.getElementById("screenContextMenu");
            menu.innerHTML = `
                <div class="menu-item restore" onclick="requestSingleAction('restore', '${id}', '${type}', '${name.replace(/'/g, "\\'")}')"><i data-lucide="refresh-ccw" class="w-4 h-4"></i> Restore File</div>
                <div class="menu-divider"></div>
                <div class="menu-item delete" onclick="requestSingleAction('delete', '${id}', '${type}', '${name.replace(/'/g, "\\'")}')"><i data-lucide="trash-2" class="w-4 h-4"></i> Delete Forever</div>
            `;
            menu.style.display = "block";
            
            const ww = window.innerWidth, wh = window.innerHeight;
            const mw = 200, mh = 100;
            let x = e.clientX, y = e.clientY;
            if (x + mw > ww) x -= mw;
            if (y + mh > wh) y -= mh;
            
            menu.style.left = `${x}px`; menu.style.top = `${y}px`;
            lucide.createIcons();
        }

        function closeContextMenu() { document.getElementById("screenContextMenu").style.display = "none"; }

        function formatDate(dateStr) {
            if (!dateStr) return "-";
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        // Modals calling executeAction (Replaced confirms)
        function requestSingleAction(action, id, type, name) {
            closeContextMenu();
            selectedItems.clear();
            selectedItems.add(`${type}-${id}`);
            
            const actionText = action === 'restore' ? 'Restore' : 'Delete Forever';
            const icon = action === 'restore' ? 'refresh-ccw' : 'trash-2';
            const color = action === 'restore' ? 'text-emerald-500' : 'text-rose-500';
            const isDanger = action === 'delete';

            sysModal.show({
                type: 'confirm', title: `${actionText} Protocol`, message: `Do you want to ${actionText.toLowerCase()} "${name}"?`, icon: icon, iconColor: color, danger: isDanger, confirmText: actionText,
                onConfirm: () => executeAction(action)
            });
        }

        function requestExecuteAction(action) {
            const count = selectedItems.size;
            if (count === 0) return;
            
            const actionText = action === 'restore' ? 'Restore' : 'Delete Forever';
            const icon = action === 'restore' ? 'refresh-ccw' : 'trash-2';
            const color = action === 'restore' ? 'text-emerald-500' : 'text-rose-500';
            const isDanger = action === 'delete';

            sysModal.show({
                type: 'confirm', title: `Batch ${actionText}`, message: `${actionText} ${count} selected files?`, icon: icon, iconColor: color, danger: isDanger, confirmText: actionText,
                onConfirm: () => executeAction(action)
            });
        }

        // ORIGINAL LOGIC PRESERVED (Using rawText to trace errors)
        async function executeAction(action) {
            const items = Array.from(selectedItems).map(key => {
                const [type, id] = key.split('-');
                return { id, type };
            });

            if (items.length === 0) return;

            const endpoint = action === 'restore' ? '../User_Backend/restore_trash.php' : '../User_Backend/delete_trash.php';
            
            try {
                const res = await fetch(endpoint, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ items }) 
                });
                
                const rawText = await res.text();
                let data;
                try { data = JSON.parse(rawText); } 
                catch (e) {
                    console.error("PHP Error:", rawText);
                    showToast("Server output error. Check F12 Console.", "error");
                    return;
                }

                if (data.success || data.status === 'success') { 
                    showToast(`Files successfully ${action === 'restore' ? 'restored to Cabinet' : 'deleted permanently'}.`);
                    selectedItems.clear(); 
                    fetchTrash(); 
                } else {
                    showToast(data.error || "Operation failed.", "error");
                }
            } catch (e) { 
                showToast("Server connection error.", "error"); 
            }
        }

        function showToast(message, type = "success") {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            const styles = { success: 'bg-white border-emerald-500 text-emerald-700', error: 'bg-white border-rose-500 text-rose-700', info: 'bg-white border-[#03acfa] text-[#03acfa]' };
            toast.className = `p-4 rounded-[24px] border-l-4 shadow-xl flex items-center gap-4 animate-toast ${styles[type] || styles.success} font-sans`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-6 h-6 shrink-0"></i><span class="text-[10px] font-black uppercase tracking-[2px] leading-none">${message}</span>`;
            container.appendChild(toast); lucide.createIcons();
            setTimeout(() => { toast.classList.add('opacity-0', '-translate-y-4', 'transition-all', 'duration-500'); setTimeout(() => toast.remove(), 500); }, 3500);
        }

        function handleLogout() { 
            sysModal.show({
                type: 'confirm', title: 'Security Protocol', message: 'Terminate workspace session?', danger: true, confirmText: 'Log Out',
                onConfirm: () => window.location.href = "../Backend/logout.php"
            });
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('hidden'); }
    </script>
</body>
